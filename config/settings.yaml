# Global Business & Pipeline Settings for P&G Ad Budget Optimizer

project_name: "pg_ad_optimizer"
random_seed: 42

# Financial & Ad Budget Defaults
base_ad_budget: 100000.0          # Base budget per segment/period (e.g. INR / USD)
currency: "USD"                   # Currency code
target_roi: 1.20                  # Profit ROI hurdle rate (incremental profit / ad spend)
target_roas: 4.00                 # Target return on ad spend
average_margin_percentage: 0.35   # 35% Gross margin assumption
average_selling_price: 12.50      # Average P&G basket item price
supply_target_days: 21            # Inventory safety cover target

# Need Zone & Confidence Settings
need_zone_items_limit: 10         # First 10 items added = Last 10 scanned at checkout
minimum_orders_for_confidence: 30 # Minimum sample size per segment for statistical confidence
confidence_level: 0.95            # Wilson score 95% confidence interval

# Multiplier Thresholds
multipliers:
  demand:
    tier_1: { max_share: 0.10, multiplier: 1.5 } # Awareness push
    tier_2: { max_share: 0.30, multiplier: 1.3 } # Growth opportunity
    tier_3: { max_share: 0.50, multiplier: 1.0 } # Baseline demand
    tier_4: { max_share: 0.80, multiplier: 1.3 } # Strong demand expansion
    tier_5: { max_share: 1.00, multiplier: 0.8 } # High saturation / maintain
  supply:
    critical_stockout: { max_score: 0.60, multiplier: 0.0 }  # Stop advertising immediately
    low_stock:         { max_score: 0.80, multiplier: 0.5 }  # Partial budget
    adequate_stock:    { max_score: 1.00, multiplier: 1.0 }  # Full budget
    surplus_stock:     { min_score: 1.00, multiplier: 1.1 }  # Aggressive push

# Paths Configuration
paths:
  raw_cache_dir: "data/cache"
  processed_dir: "data/processed"
  output_dir: "data/output"
  sqlite_db: "data/processed/pg_ad_optimizer.db"
