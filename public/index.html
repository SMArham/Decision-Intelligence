<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>P&G Advertisement Budget Decision Engine</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css"
    />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0b0f19;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "numpy", "scipy", "scikit-learn", "plotly", "pyyaml", "python-dotenv"],
          entrypoint: "src/dashboard/app.py",
          files: {
            "src/dashboard/app.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/dashboard/app.py"
            },
            "src/dashboard/charts.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/dashboard/charts.py"
            },
            "src/models/clustering.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/models/clustering.py"
            },
            "src/models/fuzzy_engine.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/models/fuzzy_engine.py"
            },
            "src/models/classifier.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/models/classifier.py"
            },
            "src/models/uplift.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/models/uplift.py"
            },
            "src/rules/before_after.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/rules/before_after.py"
            },
            "src/rules/budget.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/rules/budget.py"
            },
            "src/rules/roi.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/rules/roi.py"
            },
            "src/analytics/financials.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/analytics/financials.py"
            },
            "src/analytics/metrics.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/analytics/metrics.py"
            },
            "src/analytics/statistics.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/analytics/statistics.py"
            },
            "src/data/clean.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/data/clean.py"
            },
            "src/data/ingest.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/data/ingest.py"
            },
            "src/data/sample_generator.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/data/sample_generator.py"
            },
            "src/features/basket.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/features/basket.py"
            },
            "src/features/brand.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/features/brand.py"
            },
            "src/features/need_want.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/features/need_want.py"
            },
            "src/features/supply.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/features/supply.py"
            },
            "src/validation/checks.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/validation/checks.py"
            },
            "src/config.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/config.py"
            },
            "src/logging.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/logging.py"
            },
            "src/exceptions.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/exceptions.py"
            },
            "src/utils/io.py": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/src/utils/io.py"
            },
            "config/settings.yaml": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/config/settings.yaml"
            },
            "config/financials.yaml": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/config/financials.yaml"
            },
            "config/pg_brands.yaml": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/config/pg_brands.yaml"
            },
            "config/need_want_mapping.yaml": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/config/need_want_mapping.yaml"
            },
            "config/supply.yaml": {
              url: "https://raw.githubusercontent.com/SMArham/Decision-Intelligence/main/config/supply.yaml"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
