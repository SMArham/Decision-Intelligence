t_order\"]\n    for col in required_op_cols:\n        if col not in df_op.columns:\n            raise MissingColumnError(f\"Missing required column '{col}' in order_products table.\")\n\n    df_op = df_op.dropna(subset=required_op_cols)\n    df_op = df_op.drop_duplicates(subset=[\"order_id\", \"product_id\"])\n\n    df_op[\"order_id\"] = pd.to_numeric(df_op[\"order_id\"], errors=\"coerce\").astype(\"int64\")\n    df_op[\"product_id\"] = pd.to_numeric(df_op[\"product_id\"], errors=\"coerce\").astype(\"int64\")\n    df_op[\"add_to_cart_order\"] = pd.to_numeric(df_op[\"add_to_cart_order\"], errors=\"coerce\").astype(\"int32\")\n    \n    # Filter out non-positive add_to_cart_order\n    df_op = df_op[df_op[\"add_to_cart_order\"] > 0]\n    if \"reordered\" in df_op.columns:\n        df_op[\"reordered\"] = pd.to_numeric(df_op[\"reordered\"], errors=\"coerce\").fillna(0).astype(\"int8\")\n\n    # 3. Products\n    df_products = datasets.get(\"products\")\n    if df_products is None or df_products.empty:\n        raise EmptyDataError(\"Products table is missing or empty.\")\n    \n    df_products = df_products.dropna(subset=[\"product_id\", \"product_name\"])\n    df_products[\"product_id\"] = pd.to_numeric(df_products[\"product_id\"], errors=\"coerce\").astype(\"int64\")\n    df_products[\"product_name\"] = df_products[\"product_name\"].astype(str).str.strip()\n    if \"aisle_id\" in df_products.columns:\n        df_products[\"aisle_id\"] = pd.to_numeric(df_products[\"aisle_id\"], errors=\"coerce\").fillna(0).astype(\"int32\")\n    if \"department_id\" in df_products.columns:\n        df_products[\"department_id\"] = pd.to_numeric(df_products[\"department_id\"], errors=\"coerce\").fillna(0).astype(\"int32\")\n\n    # 4. Departments\n    df_dept = datasets.get(\"departments\")\n    if df_dept is not None and not df_dept.empty:\n        df_dept[\"department_id\"] = pd.to_numeric(df_dept[\"department_id\"], errors=\"coerce\").astype(\"int32\")\n        df_dept[\"department\"] = df_dept[\"department\"].astype(str).str.strip().str.lower()\n    else:\n        df_dept = pd.DataFrame(columns=[\"department_id\", \"department\"])\n\n    # 5. Aisles\n    df_aisles = datasets.get(\"aisles\")\n    if df_aisles is not None and not df_aisles.empty:\n        df_aisles[\"aisle_id\"] = pd.to_numeric(df_aisles[\"aisle_id\"], errors=\"coerce\").astype(\"int32\")\n        df_aisles[\"aisle\"] = df_aisles[\"aisle\"].astype(str).str.strip().str.lower()\n    else:\n        df_aisles = pd.DataFrame(columns=[\"aisle_id\", \"aisle\"])\n\n    logger.info(\n        f\"Data cleaning complete: {len(df_orders)} orders, {len(df_op)} order_items, \"\n        f\"{len(df_products)} products, {len(df_dept)} departments, {len(df_aisles)} aisles.\"\n    )\n\n    return {\n        \"orders\": df_orders,\n        \"order_products\": df_op,\n        \"products\": df_products,\n        \"departments\": df_dept,\n        \"aisles\": df_aisles,\n    }\n",
  "src/data/sample_generator.py": "\"\"\"\nRealistic Instacart Sample Dataset Generator.\nUsed as test fixtures, offline demos, and automated fallback when Kaggle terms are pending.\n\"\"\"\n\nimport random\nfrom pathlib import Path\nfrom typing import Dict, List, Tuple\nimport numpy as np\nimport pandas as pd\nfrom src.config import get_config\nfrom src.logging import get_logger\n\nlogger = get_logger(\"sample_generator\")\n\n\ndef generate_instacart_sample(\n    num_orders: int = 1200,\n    num_users: int = 150,\n    seed: int = 42,\n    save_dir: Path = None\n) -> Dict[str, pd.DataFrame]:\n    \"\"\"\n    Generates realistic Instacart dataset tables mirroring the exact schema,\n    including authentic P&G brand items across household, personal care, and babies departments.\n    \"\"\"\n    np.random.seed(seed)\n    random.seed(seed)\n    config = get_config()\n\n    # 1. Departments\n    departments_data = [\n        {\"department_id\": 1, \"department\": \"frozen\"},\n        {\"department_id\": 2, \"department\": \"other\"},\n        {\"department_id\": 3, \"department\": \"bakery\"},\n        {\"department_id\": 4, \"department\": \"produce\"},\n        {\"department_id\": 5, \"department\": \"alcohol\"},\n        {\"department_id\": 6, \"department\": \"international\"},\n        {\"department_id\": 7, \"department\": \"beverages\"},\n        {\"department_id\": 8, \"department\": \"pets\"},\n        {\"department_id\": 9, \"department\": \"dry goods pasta\"},\n        {\"department_id\": 10, \"department\": \"bulk\"},\n        {\"department_id\": 11, \"department\": \"personal care\"},\n        {\"department_id\": 12, \"department\": \"meat seafood\"},\n        {\"department_id\": 13, \"department\": \"pantry\"},\n        {\"department_id\": 14, \"department\": \"breakfast\"},\n        {\"department_id\": 15, \"department\": \"canned goods\"},\n        {\"department_id\": 16, \"department\": \"dairy eggs\"},\n        {\"department_id\": 17, \"department\": \"household\"},\n        {\"department_id\": 18, \"department\": \"babies\"},\n        {\"department_id\": 19, \"department\": \"snacks\"},\n        {\"department_id\": 20, \"department\": \"deli\"},\n        {\"department_id\": 21, \"department\": \"missing\"},\n    ]\n    df_departments = pd.DataFrame(departments_data)\n\n    # 2. Aisles\n    aisles_data = [\n        {\"aisle_id\": 1, \"aisle\": \"prepared soups salads\"},\n        {\"aisle_id\": 2, \"aisle\": \"specialty cheeses\"},\n        {\"aisle_id\": 3, \"aisle\": \"energy granola bars\"},\n        {\"aisle_id\": 4, \"aisle\": \"instant foods\"},\n        {\"aisle_id\": 20, \"aisle\": \"oral hygiene\"},\n        {\"aisle_id\": 22, \"aisle\": \"hair care\"},\n        {\"aisle_id\": 25, \"aisle\": \"soap\"},\n        {\"aisle_id\": 30, \"aisle\": \"body lotions soap\"},\n        {\"aisle_id\": 54, \"aisle\": \"paper goods\"},\n        {\"aisle_id\": 56, \"aisle\": \"diapers wipes\"},\n        {\"aisle_id\": 74, \"aisle\": \"dish detergents\"},\n        {\"aisle_id\": 75, \"aisle\": \"laundry\"},\n        {\"aisle_id\": 77, \"aisle\": \"soft drinks\"},\n        {\"aisle_id\": 80, \"aisle\": \"shave needs\"},\n        {\"aisle_id\": 84, \"aisle\": \"cleaning products\"},\n        {\"aisle_id\": 92, \"aisle\": \"baby food formula\"},\n        {\"aisle_id\": 100, \"aisle\": \"chips pretzels\"},\n        {\"aisle_id\": 107, \"aisle\": \"chips pretzels\"},\n        {\"aisle_id\": 126, \"aisle\": \"feminine care\"},\n    ]\n    df_aisles = pd.DataFrame(aisles_data)\n\n    # 3. Products (Authentic P&G Items + Non-P&G competitors & groceries)\n    products_catalog = [\n        # P&G Items - Household & Laundry\n        (101, \"Tide PODS Free & Gentle Liquid Laundry Detergent\", 75, 17),\n        (102, \"Tide Original Liquid Laundry Detergent 64 Loads\", 75, 17),\n        (103, \"Ariel Concentrated Power Liquid Detergent\", 75, 17),\n        (104, \"Dawn Ultra Original Liquid Dish Soap\", 74, 17),\n        (105, \"Dawn Platinum Dishwashing Foam\", 74, 17),\n        (106, \"Downy Ultra Liquid Fabric Conditioner Clean Breeze\", 75, 17),\n        (107, \"Febreze Air Freshener Spray Linen & Sky\", 84, 17),\n        (108, \"Swiffer Sweeper Dry Sweeping Cloth Refills\", 84, 17),\n        (109, \"Cascade Complete Dishwasher Detergent Pods\", 74, 17),\n        (110, \"Bounty Select-a-Size Paper Towels White\", 54, 17),\n        (111, \"Charmin Ultra Soft Toilet Paper 12 Rolls\", 54, 17),\n        (112, \"Gain Flings Original Liquid Laundry Pods\", 75, 17),\n\n        # P&G Items - Personal Care & Grooming\n        (201, \"Pampers Swaddlers Diapers Size 3\", 56, 18),\n        (202, \"Pampers Sensitive Baby Wipes 6-Pack\", 56, 18),\n        (203, \"Whisper Ultra Clean Sanitary Napkins Wings\", 126, 11),\n        (204, \"Always Ultra Thin Size 1 Pads with Wings\", 126, 11),\n        (205, \"Pantene Pro-V Daily Moisture Renewal Shampoo\", 22, 11),\n        (206, \"Head & Shoulders Classic Clean Anti-Dandruff Shampoo\", 22, 11),\n        (207, \"Gillette Fusion5 Men's Razor Blade Refills\", 80, 11),\n        (208, \"Gillette Venus ComfortGlide Women's Razor\", 80, 11),\n        (209, \"Oral-B CrossAction All In One Toothbrush\", 20, 11),\n        (210, \"Crest 3D White Radiant Mint Whitening Toothpaste\", 20, 11),\n        (211, \"Safeguard Antibacterial Liquid Hand Soap\", 25, 11),\n        (212, \"Old Spice High Endurance Pure Sport Deodorant\", 30, 11),\n        (213, \"Olay Regenerist Micro-Sculpting Face Cream\", 30, 11),\n        (214, \"Braun Series 7 Replacement Foil Head\", 80, 11),\n        (215, \"Ambi Pur Car Air Freshener Clip\", 84, 17),\n\n        # Non-P&G Generic / Competitor Groceries & Want Items\n        (301, \"Organic Whole Milk 1 Gallon\", 84, 16),\n        (302, \"Large Grade A Brown Eggs 12 Count\", 84, 16),\n        (303, \"Organic Hass Avocado Single\", 24, 4),\n        (304, \"Organic Bananas Bundle\", 24, 4),\n        (305, \"Boneless Skinless Chicken Breasts\", 35, 12),\n        (306, \"Colgate Total Clean Mint Toothpaste\", 20, 11),\n        (307, \"Seventh Generation Natural Dish Liquid\", 74, 17),\n        (308, \"Huggies Little Snugglers Diapers Size 3\", 56, 18),\n        (309, \"Dove Deep Moisture Nourishing Body Wash\", 25, 11),\n        (310, \"Lay's Classic Potato Chips Party Size\", 107, 19),\n        (311, \"Doritos Nacho Cheese Tortilla Chips\", 107, 19),\n        (312, \"Coca-Cola Classic Soda 12-Pack Cans\", 77, 7),\n        (313, \"Pepsi Wild Cherry Soda 12-Pack\", 77, 7),\n        (314, \"Oreo Double Stuf Chocolate Sandwich Cookies\", 61, 19),\n        (315, \"Ben & Jerry's Half Baked Ice Cream Pint\", 37, 1),\n        (316, \"Snickers Chocolate Candy Bar King Size\", 45, 19),\n        (317, \"Organic Strawberries 1 lb Clamshell\", 24, 4),\n        (318, \"Artisan Sourdough Bread Loaf\", 112, 3),\n        (319, \"Sparkling Water Lime Essence 8-Pack\", 77, 7),\n        (320, \"Heinz Tomato Ketchup 32 oz Bottle\", 72, 13),\n        (321, \"Kraft Natural Extra Sharp Cheddar Cheese\", 21, 16),\n        (322, \"Starbucks Pike Place Medium Roast Ground Coffee\", 26, 7),\n        (323, \"Nature Valley Crunchy Oats 'n Honey Granola Bars\", 3, 19),\n        (324, \"Kleenex Ultra Soft Facial Tissues 3-Pack\", 54, 17),\n        (325, \"Persil ProClean Liquid Laundry Detergent\", 75, 17),\n    ]\n\n    df_products = pd.DataFrame(\n        products_catalog,\n        columns=[\"product_id\", \"product_name\", \"aisle_id\", \"department_id\"]\n    )\n\n    # 4. Generate Orders & Order Products\n    orders_records = []\n    order_products_records = []\n\n    need_product_ids = [p[0] for p in products_catalog if p[3] in [11, 17, 18, 16, 4, 12, 13]]\n    want_product_ids = [p[0] for p in products_catalog if p[3] in [19, 7, 1, 3, 5]]\n    all_product_ids = [p[0] for p in products_catalog]\n\n    for order_id in range(1, num_orders + 1):\n        user_id = random.randint(1, num_users)\n        order_number = random.randint(1, 40)\n        order_dow = random.randint(0, 6)\n        order_hour_of_day = random.randint(7, 21)\n        days_since_prior = random.choice([3, 5, 7, 10, 14, 21, 30, None])\n\n        orders_records.append({\n            \"order_id\": order_id,\n            \"user_id\": user_id,\n            \"eval_set\": \"prior\",\n            \"order_number\": order_number,\n            \"order_dow\": order_dow,\n            \"order_hour_of_day\": order_hour_of_day,\n            \"days_since_prior_order\": days_since_prior,\n        })\n\n        # Basket size: 6 to 24 items\n        basket_size = random.randint(6, 24)\n\n        # Realistic FMCG Shopping Behaviour:\n        # Customers select staple Need items first (first in cart, early add_to_cart_order)\n        # and discretionary/impulse items later in the shopping trip.\n        num_need_items = min(basket_size, random.randint(4, max(4, basket_size - 2)))\n        num_want_items = basket_size - num_need_items\n\n        chosen_needs = list(np.random.choice(need_product_ids, size=num_need_items, replace=(num_need_items > len(need_product_ids))))\n        chosen_wants = list(np.random.choice(want_product_ids, size=num_want_items, replace=(num_want_items > len(want_product_ids)))) if num_want_items > 0 else []\n\n        ordered_items = chosen_needs + chosen_wants\n\n        for rank, p_id in enumerate(ordered_items, start=1):\n            reordered = 1 if random.random() > 0.4 else 0\n            order_products_records.append({\n                \"order_id\": order_id,\n                \"product_id\": p_id,\n                \"add_to_cart_order\": rank,\n                \"reordered\": reordered,\n            })\n\n    df_orders = pd.DataFrame(orders_records)\n    df_order_products = pd.DataFrame(order_products_records)\n\n    logger.info(\n        f\"Generated sample Instacart dataset: {len(df_orders)} orders, \"\n        f\"{len(df_order_products)} basket items, {len(df_products)} catalog products.\"\n    )\n\n    dataset_dict = {\n        \"orders\": df_orders,\n        \"order_products__prior\": df_order_products,\n        \"products\": df_products,\n        \"departments\": df_departments,\n        \"aisles\": df_aisles,\n    }\n\n    if save_dir:\n        save_p = Path(save_dir)\n        save_p.mkdir(parents=True, exist_ok=True)\n        for name, df in dataset_dict.items():\n            csv_file = save_p / f\"{name}.csv\"\n            df.to_csv(csv_file, index=False)\n        logger.info(f\"Saved sample CSVs to {save_p}\")\n\n    return dataset_dict\n",
  "src/features/basket.py": "\"\"\"\nBasket feature engineering: Stack (LIFO) checkout sequence, basket size, and need zone demarcation.\n\"\"\"\n\nfrom typing import Optional\nimport numpy as np\nimport pandas as pd\nfrom src.config import get_config\nfrom src.exceptions import MissingColumnError, EmptyDataError\nfrom src.logging import get_logger\n\nlogger = get_logger(\"basket_features\")\n\n\ndef calculate_basket_features(\n    df_order_products: pd.DataFrame,\n    df_orders: Optional[pd.DataFrame] = None,\n    need_zone_limit: int = 10\n) -> pd.DataFrame:\n    \"\"\"\n    Computes core basket sequence features:\n    1. basket_size: Total items in order.\n    2. checkout_rank: Stack (LIFO) checkout sequence proxy = basket_size - add_to_cart_order + 1.\n    3. is_in_need_zone: True if checkout_rank is among the last N scanned items (first N added).\n    4. confidence_flag: 'HIGH' if basket_size >= need_zone_limit, else 'LOW'.\n    5. proxy_period: Discrete period bin for trend analytics.\n    \"\"\"\n    if df_order_products.empty:\n        raise EmptyDataError(\"Order products dataframe is empty.\")\n\n    required_cols = [\"order_id\", \"product_id\", \"add_to_cart_order\"]\n    for col in required_cols:\n        if col not in df_order_products.columns:\n            raise MissingColumnError(f\"Missing required column '{col}' in order_products.\")\n\n    df = df_order_products.copy()\n\n    # 1. Compute basket_size per order\n    basket_sizes = df.groupby(\"order_id\")[\"add_to_cart_order\"].transform(\"max\")\n    df[\"basket_size\"] = basket_sizes.astype(\"int32\")\n\n    # 2. Stack (LIFO) Checkout Rank: First in trolley = Bottom of stack = Last scanned by cashier\n    # Item added 1st in basket of size 20 -> checkout_rank = 20 - 1 + 1 = 20 (scanned last)\n    # Item added 20th in basket of size 20 -> checkout_rank = 20 - 20 + 1 = 1 (scanned first)\n    df[\"checkout_rank\"] = (df[\"basket_size\"] - df[\"add_to_cart_order\"] + 1).astype(\"int32\")\n\n    # 3. Need Zone: Last 10 scanned items\n    # For basket_size >= 10: checkout_rank > basket_size - 10  (i.e. add_to_cart_order <= 10)\n    # For basket_size < 10: all items are considered need zone, but flagged as LOW confidence\n    df[\"is_in_need_zone\"] = np.where(\n        df[\"basket_size\"] >= need_zone_limit,\n        df[\"checkout_rank\"] > (df[\"basket_size\"] - need_zone_limit),\n        True\n    )\n\n    df[\"basket_confidence_flag\"] = np.where(\n        df[\"basket_size\"] >= need_zone_limit,\n        \"HIGH\",\n        \"LOW\"\n    )\n\n    # 4. Proxy Period: Assign orders to sequential proxy periods (e.g. Proxy_Period_1..4)\n    # Allows trend analysis without pretending to have real calendar dates\n    if df_orders is not None and not df_orders.empty and \"order_number\" in df_orders.columns:\n        df = df.merge(df_orders[[\"order_id\", \"order_number\"]], on=\"order_id\", how=\"left\")\n        # Bin order_number into 4 proxy periods\n        bins = [0, 10, 20, 30, 999]\n        labels = [\"Proxy_Period_1\", \"Proxy_Period_2\", \"Proxy_Period_3\", \"Proxy_Period_4\"]\n        df[\"proxy_period\"] = pd.cut(df[\"order_number\"].fillna(1), bins=bins, labels=labels).astype(str)\n        df.drop(columns=[\"order_number\"], inplace=True)\n    else:\n        # Bin by order_id quantiles\n        try:\n            df[\"proxy_period\"] = pd.qcut(\n                df[\"order_id\"],\n                q=4,\n                labels=[\"Proxy_Period_1\", \"Proxy_Period_2\", \"Proxy_Period_3\", \"Proxy_Period_4\"]\n            ).astype(str)\n        except Exception:\n            df[\"proxy_period\"] = \"Proxy_Period_1\"\n\n    logger.info(\n        f\"Calculated basket features for {len(df)} items across {df['order_id'].nunique()} orders. \"\n        f\"Need zone items: {df['is_in_need_zone'].sum()}/{len(df)} ({df['is_in_need_zone'].mean():.1%}).\"\n    )\n\n    return df\n",
  "src/features/brand.py": "\"\"\"\nP&G brand identification and regex matching module.\n\"\"\"\n\nimport re\nfrom typing import Dict, List, Optional, Set, Tuple\nimport pandas as pd\nfrom src.config import get_config\nfrom src.exceptions import MissingColumnError\nfrom src.logging import get_logger\n\nlogger = get_logger(\"brand_features\")\n\n\ndef match_pg_brand(product_name: str, include_patterns: List[re.Pattern], exclude_patterns: List[re.Pattern]) -> Tuple[bool, Optional[str]]:\n    \"\"\"\n    Checks if a product_name matches any P&G brand keyword while avoiding false positives.\n    Returns (is_pg, matched_brand_name).\n    \"\"\"\n    if not isinstance(product_name, str) or not product_name.strip():\n        return False, None\n\n    name_lower = product_name.lower().strip()\n\n    # 1. Check exclusions\n    for exc in exclude_patterns:\n        if exc.search(name_lower):\n            return False, None\n\n    # 2. Check inclusions\n    for inc in include_patterns:\n        match = inc.search(name_lower)\n        if match:\n            return True, match.group(0).capitalize()\n\n    return False, None\n\n\ndef enrich_with_pg_brands(\n    df_products: pd.DataFrame,\n    include_keywords: Optional[List[str]] = None,\n    exclude_keywords: Optional[List[str]] = None\n) -> pd.DataFrame:\n    \"\"\"\n    Tags products table with `is_pg_product` and `matched_brand`.\n    \"\"\"\n    if \"product_name\" not in df_products.columns:\n        raise MissingColumnError(\"Column 'product_name' missing from products DataFrame.\")\n\n    config = get_config()\n    inc_words = include_keywords or config.include_brand_keywords\n    exc_words = exclude_keywords or config.exclude_brand_keywords\n\n    # Compile regexes with word boundaries for precision\n    include_patterns = [\n        re.compile(r\"\\b\" + re.escape(k.lower()) + r\"\\b\", re.IGNORECASE)\n        for k in inc_words if k.strip()\n    ]\n    exclude_patterns = [\n        re.compile(r\"\\b\" + re.escape(k.lower()) + r\"\\b\", re.IGNORECASE)\n        for k in exc_words if k.strip()\n    ]\n\n    df = df_products.copy()\n\n    is_pg_list = []\n    brand_list = []\n\n    for name in df[\"product_name\"]:\n        is_pg, brand = match_pg_brand(name, include_patterns, exclude_patterns)\n        is_pg_list.append(is_pg)\n        brand_list.append(brand if is_pg else \"Non-P&G\")\n\n    df[\"is_pg_product\"] = is_pg_list\n    df[\"matched_brand\"] = brand_list\n\n    pg_count = df[\"is_pg_product\"].sum()\n    logger.info(\n        f\"P&G Brand Matching completed: {pg_count}/{len(df)} products matched as P&G \"\n        f\"({pg_count/len(df):.1%}). Distinct brands identified: {df[df['is_pg_product']]['matched_brand'].nunique()}\"\n    )\n\n    return df\n\n\ndef generate_brand_audit_report(df_products: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"\n    Generates a diagnostic audit of identified P&G products for verification.\n    \"\"\"\n    if \"is_pg_product\" not in df_products.columns:\n        df_products = enrich_with_pg_brands(df_products)\n\n    pg_products = df_products[df_products[\"is_pg_product\"]].copy()\n    if pg_products.empty:\n        logger.warning(\"No P&G products identified in dataset!\")\n        return pd.DataFrame(columns=[\"product_id\", \"product_name\", \"matched_brand\"])\n\n    return pg_products[[\"product_id\", \"product_name\", \"matched_brand\"]].sort_values(\"matched_brand\")\n",
  "src/features/need_want.py": "\"\"\"\nNeed vs Want classification module for FMCG departments and aisles.\n\"\"\"\n\nfrom typing import Dict, Optional\nimport pandas as pd\nfrom src.config import get_config\nfrom src.logging import get_logger\n\nlogger = get_logger(\"need_want_features\")\n\n\ndef enrich_with_need_want(\n    df: pd.DataFrame,\n    df_departments: Optional[pd.DataFrame] = None,\n    df_aisles: Optional[pd.DataFrame] = None\n) -> pd.DataFrame:\n    \"\"\"\n    Enriches dataset with `is_need_department`, `is_want_department`, and `need_want_category`.\n    Combines rule-based department and aisle definitions from configuration.\n    \"\"\"\n    config = get_config()\n    df_out = df.copy()\n\n    # Merge department & aisle names if IDs are present and names are missing\n    if \"department\" not in df_out.columns and df_departments is not None and \"department_id\" in df_out.columns:\n        df_out = df_out.merge(df_departments[[\"department_id\", \"department\"]], on=\"department_id\", how=\"left\")\n\n    if \"aisle\" not in df_out.columns and df_aisles is not None and \"aisle_id\" in df_out.columns:\n        df_out = df_out.merge(df_aisles[[\"aisle_id\", \"aisle\"]], on=\"aisle_id\", how=\"left\")\n\n    # Lowercase for exact comparison\n    dept_series = df_out[\"department\"].astype(str).str.lower().fillna(\"\")\n    aisle_series = df_out[\"aisle\"].astype(str).str.lower().fillna(\"\") if \"aisle\" in df_out.columns else pd.Series([\"\"] * len(df_out))\n\n    # Check if department or aisle is in need list\n    is_need = dept_series.isin(config.need_departments) | aisle_series.isin(config.need_aisles)\n    \n    # Check if department or aisle is in want list\n    is_want = (dept_series.isin(config.want_departments) | aisle_series.isin(config.want_aisles)) & (~is_need)\n\n    df_out[\"is_need_department\"] = is_need\n    df_out[\"is_want_department\"] = is_want\n    df_out[\"need_want_category\"] = \"Neutral / Other\"\n    df_out.loc[is_need, \"need_want_category\"] = \"Essential Need\"\n    df_out.loc[is_want, \"need_want_category\"] = \"Discretionary Want\"\n\n    logger.info(\n        f\"Need/Want categorization: {is_need.sum()} Need items ({is_need.mean():.1%}), \"\n        f\"{is_want.sum()} Want items ({is_want.mean():.1%}).\"\n    )\n\n    return df_out\n",
  "src/features/supply.py": "\"\"\"\nSupply availability proxy and inventory scoring module.\n\"\"\"\n\nfrom typing import Dict, Optional\nimport numpy as np\nimport pandas as pd\nfrom src.config import get_config\nfrom src.logging import get_logger\n\nlogger = get_logger(\"supply_features\")\n\n\ndef calculate_supply_score(\n    df: pd.DataFrame,\n    overrides: Optional[Dict[str, float]] = None\n) -> pd.DataFrame:\n    \"\"\"\n    Computes a transparent Supply Availability Proxy Score (0.0 to 1.2) for each segment.\n    Factors:\n    1. Reorder regularity proxy (higher reorder rate indicates steady supply chain).\n    2. Basket frequency presence.\n    3. Manual department overrides from config/supply.yaml.\n    \"\"\"\n    config = get_config()\n    supply_cfg = config.supply\n    dept_overrides = overrides or supply_cfg.get(\"department_supply_overrides\", {})\n    default_score = float(supply_cfg.get(\"default_supply_score\", 0.95))\n\n    # Segment by department if available, else overall\n    segment_col = \"department\" if \"department\" in df.columns else \"segment\"\n\n    if segment_col in df.columns:\n        # Group metrics\n        grouped = df.groupby(segment_col).agg(\n            reorder_rate=(\"reordered\", \"mean\") if \"reordered\" in df.columns else (\"product_id\", \"count\"),\n            item_count=(\"product_id\", \"count\")\n        ).reset_index()\n\n        # Score formulation: Baseline from config override or computed proxy\n        scores = []\n        for _, row in grouped.iterrows():\n            seg_name = str(row[segment_col]).lower().strip()\n            if seg_name in dept_overrides:\n                score = float(dept_overrides[seg_name])\n            else:\n                # Proxy formula: base around default_score + slight variation based on reorder stability\n                if \"reordered\" in df.columns:\n                    reorder_val = float(row[\"reorder_rate\"])\n                    score = default_score * (0.85 + 0.3 * reorder_val)\n                else:\n                    score = default_score\n            scores.append(round(min(max(score, 0.0), 1.2), 3))\n\n        grouped[\"supply_score\"] = scores\n        return grouped[[segment_col, \"supply_score\"]]\n\n    # Fallback single row\n    return pd.DataFrame([{segment_col: \"All_Categories\", \"supply_score\": default_score}])\n",
  "src/validation/checks.py": "\"\"\"\nData validation checks and automated quality reporting.\n\"\"\"\n\nfrom typing import Dict, List, Tuple\nimport numpy as np\nimport pandas as pd\nfrom src.logging import get_logger\n\nlogger = get_logger(\"data_quality\")\n\n\ndef run_data_quality_checks(\n    df_features: pd.DataFrame,\n    df_need_share: pd.DataFrame,\n    df_recommendations: pd.DataFrame\n) -> pd.DataFrame:\n    \"\"\"\n    Runs comprehensive data quality checks across feature and recommendation tables:\n    1. Check presence of non-null order_id, product_id, add_to_cart_order.\n    2. Check that add_to_cart_order is strictly positive (> 0).\n    3. Check that basket_size is strictly positive (> 0).\n    4. Check that pg_need_share is within [0.0, 1.0].\n    5. Check that supply_score is non-negative (>= 0.0).\n    6. Check that recommended_budget is non-negative (>= 0.0).\n    7. Check that expected ROI / ROAS values are finite and valid numbers.\n    8. Check P&G brand identification match rate.\n    \"\"\"\n    logger.info(\"Executing comprehensive data quality audit...\")\n\n    checks: List[Dict[str, any]] = []\n\n    # 1. Feature Table Checks\n    if not df_features.empty:\n        # Check order_id\n        null_orders = int(df_features[\"order_id\"].isnull().sum())\n        checks.append({\n            \"table\": \"basket_features\",\n            \"check_name\": \"order_id_not_null\",\n            \"status\": \"PASS\" if null_orders == 0 else \"FAIL\",\n            \"details\": f\"Null count: {null_orders}/{len(df_features)}\",\n            \"severity\": \"CRITICAL\"\n        })\n\n        # Check product_id\n        null_products = int(df_features[\"product_id\"].isnull().sum())\n        checks.append({\n            \"table\": \"basket_features\",\n            \"check_name\": \"product_id_not_null\",\n            \"status\": \"PASS\" if null_products == 0 else \"FAIL\",\n            \"details\": f\"Null count: {null_products}/{len(df_features)}\",\n            \"severity\": \"CRITICAL\"\n        })\n\n        # Check add_to_cart_order positive\n        invalid_cart_order = int((df_features[\"add_to_cart_order\"] <= 0).sum())\n        checks.append({\n            \"table\": \"basket_features\",\n            \"check_name\": \"positive_add_to_cart_order\",\n            \"status\": \"PASS\" if invalid_cart_order == 0 else \"FAIL\",\n            \"details\": f\"Non-positive rows: {invalid_cart_order}/{len(df_features)}\",\n            \"severity\": \"HIGH\"\n        })\n\n        # Check basket_size positive\n        invalid_basket = int((df_features[\"basket_size\"] <= 0).sum())\n        checks.append({\n            \"table\": \"basket_features\",\n            \"check_name\": \"positive_basket_size\",\n            \"status\": \"PASS\" if invalid_basket == 0 else \"FAIL\",\n            \"details\": f\"Non-positive baskets: {invalid_basket}/{len(df_features)}\",\n            \"severity\": \"HIGH\"\n        })\n\n        # Check P&G match rate\n        pg_match_rate = df_features[\"is_pg_product\"].mean()\n        pg_status = \"PASS\" if (0.01 <= pg_match_rate <= 0.85) else \"WARNING\"\n        checks.append({\n            \"table\": \"basket_features\",\n            \"check_name\": \"pg_brand_match_rate_valid\",\n            \"status\": pg_status,\n            \"details\": f\"P&G match rate: {pg_match_rate:.2%} ({df_features['is_pg_product'].sum()} items)\",\n            \"severity\": \"MEDIUM\"\n        })\n\n    # 2. Need Share Table Checks\n    if not df_need_share.empty:\n        # Check pg_need_share bounds\n        out_of_bounds_share = int(((df_need_share[\"pg_need_share\"] < 0.0) | (df_need_share[\"pg_need_share\"] > 1.0)).sum())\n        checks.append({\n            \"table\": \"pg_need_share\",\n            \"check_name\": \"need_share_range_valid_0_to_1\",\n            \"status\": \"PASS\" if out_of_bounds_share == 0 else \"FAIL\",\n            \"details\": f\"Out-of-bounds rows: {out_of_bounds_share}/{len(df_need_share)}\",\n            \"severity\": \"CRITICAL\"\n        })\n\n    # 3. Budget Recommendation Checks\n    if not df_recommendations.empty:\n        # Check supply score non-negative\n        invalid_supply = int((df_recommendations[\"supply_score\"] < 0.0).sum())\n        checks.append({\n            \"table\": \"budget_recommendations\",\n            \"check_name\": \"supply_score_non_negative\",\n            \"status\": \"PASS\" if invalid_supply == 0 else \"FAIL\",\n            \"details\": f\"Negative supply score count: {invalid_supply}/{len(df_recommendations)}\",\n            \"severity\": \"HIGH\"\n        })\n\n        # Check budget non-negative\n        invalid_budget = int((df_recommendations[\"final_recommended_budget\"] < 0.0).sum())\n        checks.append({\n            \"table\": \"budget_recommendations\",\n            \"check_name\": \"budget_non_negative\",\n            \"status\": \"PASS\" if invalid_budget == 0 else \"FAIL\",\n            \"details\": f\"Negative budget count: {invalid_budget}/{len(df_recommendations)}\",\n            \"severity\": \"CRITICAL\"\n        })\n\n        # Check finite ROI\n        infinite_roi = int((~np.isfinite(df_recommendations[\"expected_profit_roi\"])).sum())\n        checks.append({\n            \"table\": \"budget_recommendations\",\n            \"check_name\": \"finite_roi_metrics\",\n            \"status\": \"PASS\" if infinite_roi == 0 else \"FAIL\",\n            \"details\": f\"Non-finite ROI count: {infinite_roi}/{len(df_recommendations)}\",\n            \"severity\": \"HIGH\"\n        })\n\n    df_report = pd.DataFrame(checks)\n    passed_count = (df_report[\"status\"] == \"PASS\").sum()\n    logger.info(f\"Data Quality Report completed: {passed_count}/{len(df_report)} checks passed.\")\n    return df_report\n",
  "src/config.py": "\"\"\"\nConfiguration manager for pg_ad_optimizer.\nLoads YAML configurations and environment variables with sensible defaults.\n\"\"\"\n\nimport os\nfrom pathlib import Path\nfrom typing import Any, Dict, List, Optional\nimport yaml\ntry:\n    from dotenv import load_dotenv\n    _HAS_DOTENV = True\nexcept ImportError:\n    _HAS_DOTENV = False\n\nfrom src.exceptions import ConfigError\nfrom src.logging import get_logger\n\nlogger = get_logger(\"config_loader\")\n\n\nclass AppConfig:\n    \"\"\"Singleton-style Application Configuration holder.\"\"\"\n\n    def __init__(self, config_dir: Optional[str] = None):\n        # Load .env file if dotenv is available\n        if _HAS_DOTENV:\n            try:\n                load_dotenv(override=True)\n            except Exception:\n                pass\n\n        self.root_dir = Path(__file__).resolve().parent.parent\n        self.config_dir = Path(config_dir) if config_dir else self.root_dir / \"config\"\n\n        # Load YAML files\n        self.settings = self._load_yaml(\"settings.yaml\")\n        self.pg_brands = self._load_yaml(\"pg_brands.yaml\")\n        self.need_want = self._load_yaml(\"need_want_mapping.yaml\")\n        self.financials = self._load_yaml(\"financials.yaml\")\n        self.supply = self._load_yaml(\"supply.yaml\")\n\n        # Core Parameters\n        self.project_name: str = self.settings.get(\"project_name\", \"pg_ad_optimizer\")\n        self.random_seed: int = int(self.settings.get(\"random_seed\", 42))\n        self.base_ad_budget: float = float(self.settings.get(\"base_ad_budget\", 100000.0))\n        self.currency: str = self.settings.get(\"currency\", \"USD\")\n        self.target_roi: float = float(self.settings.get(\"target_roi\", 1.20))\n        self.target_roas: float = float(self.settings.get(\"target_roas\", 4.00))\n        self.average_margin_percentage: float = float(self.settings.get(\"average_margin_percentage\", 0.35))\n        self.average_selling_price: float = float(self.settings.get(\"average_selling_price\", 12.50))\n        self.need_zone_items_limit: int = int(self.settings.get(\"need_zone_items_limit\", 10))\n        self.minimum_orders_for_confidence: int = int(self.settings.get(\"minimum_orders_for_confidence\", 30))\n\n        # Brand Lists\n        self.include_brand_keywords: List[str] = self.pg_brands.get(\"include_keywords\", [])\n        self.exclude_brand_keywords: List[str] = self.pg_brands.get(\"exclude_keywords\", [])\n\n        # Need / Want Categories\n        self.need_departments: List[str] = [d.lower() for d in self.need_want.get(\"need_departments\", [])]\n        self.want_departments: List[str] = [d.lower() for d in self.need_want.get(\"want_departments\", [])]\n        self.need_aisles: List[str] = [a.lower() for a in self.need_want.get(\"need_aisles\", [])]\n        self.want_aisles: List[str] = [a.lower() for a in self.need_want.get(\"want_aisles\", [])]\n\n        # Financials\n        self.company_name: str = self.financials.get(\"company\", \"The Procter & Gamble Company\")\n        self.fiscal_year: str = self.financials.get(\"fiscal_year\", \"FY2024\")\n        self.total_revenue: float = float(self.financials.get(\"total_revenue\", 84039000000.0))\n        self.advertising_expense: float = float(self.financials.get(\"advertising_expense\", 8560000000.0))\n        self.marketing_intensity: float = float(self.financials.get(\"marketing_intensity\", 0.101857))\n        self.category_revenue_shares: Dict[str, float] = self.financials.get(\"category_revenue_shares\", {})\n\n        # Paths\n        paths_cfg = self.settings.get(\"paths\", {})\n        self.raw_cache_dir: Path = self.root_dir / paths_cfg.get(\"raw_cache_dir\", \"data/cache\")\n        self.processed_dir: Path = self.root_dir / paths_cfg.get(\"processed_dir\", \"data/processed\")\n        self.output_dir: Path = self.root_dir / paths_cfg.get(\"output_dir\", \"data/output\")\n        self.sqlite_db_path: Path = self.root_dir / paths_cfg.get(\"sqlite_db\", \"data/processed/pg_ad_optimizer.db\")\n\n        # Credentials\n        self.kaggle_api_token: Optional[str] = os.getenv(\"KAGGLE_API_TOKEN\")\n        self.kaggle_username: Optional[str] = os.getenv(\"KAGGLE_USERNAME\")\n        self.kaggle_key: Optional[str] = os.getenv(\"KAGGLE_KEY\")\n\n        # Ensure directories exist\n        for d in [self.raw_cache_dir, self.processed_dir, self.output_dir]:\n            d.mkdir(parents=True, exist_ok=True)\n\n    def _load_yaml(self, filename: str) -> Dict[str, Any]:\n        filepath = self.config_dir / filename\n        if not filepath.exists():\n            logger.warning(f\"Config file not found: {filepath}. Using empty default.\")\n            return {}\n        try:\n            with open(filepath, \"r\", encoding=\"utf-8\") as f:\n                content = yaml.safe_load(f)\n                return content or {}\n        except Exception as e:\n            raise ConfigError(f\"Failed to parse YAML configuration at {filepath}: {e}\")\n\n\n# Global Config instance accessor\n_global_config: Optional[AppConfig] = None\n\n\ndef get_config(config_dir: Optional[str] = None) -> AppConfig:\n    global _global_config\n    if _global_config is None or config_dir is not None:\n        _global_config = AppConfig(config_dir=config_dir)\n    return _global_config\n",
  "src/logging.py": "\"\"\"\nLogging configuration for pg_ad_optimizer.\nProvides structured, timestamped console and file logging.\n\"\"\"\n\nimport logging\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Optional\n\n\ndef get_logger(name: str = \"pg_ad_optimizer\", log_level: Optional[str] = None) -> logging.Logger:\n    \"\"\"\n    Initializes and returns a configured logger instance.\n    \"\"\"\n    logger = logging.getLogger(name)\n    \n    # Avoid duplicate handlers if already configured\n    if logger.handlers:\n        return logger\n\n    level_str = log_level or os.getenv(\"LOG_LEVEL\", \"INFO\").upper()\n    level = getattr(logging, level_str, logging.INFO)\n    logger.setLevel(level)\n\n    # Formatter\n    formatter = logging.Formatter(\n        fmt=\"%(asctime)s [%(levelname)s] [%(name)s] - %(message)s\",\n        datefmt=\"%Y-%m-%d %H:%M:%S\"\n    )\n\n    # Console Handler\n    console_handler = logging.StreamHandler(sys.stdout)\n    console_handler.setLevel(level)\n    console_handler.setFormatter(formatter)\n    logger.addHandler(console_handler)\n\n    # Optional Log file in logs/\n    logs_dir = Path(\"logs\")\n    try:\n        logs_dir.mkdir(parents=True, exist_ok=True)\n        file_handler = logging.FileHandler(logs_dir / \"pipeline.log\", encoding=\"utf-8\")\n        file_handler.setLevel(level)\n        file_handler.setFormatter(formatter)\n        logger.addHandler(file_handler)\n    except Exception:\n        pass  # If log dir cannot be created, keep console logging\n\n    return logger\n",
  "src/exceptions.py": "\"\"\"\nCustom exceptions for pg_ad_optimizer pipeline.\n\"\"\"\n\n\nclass PGAdOptimizerError(Exception):\n    \"\"\"Base exception class for all errors in pg_ad_optimizer.\"\"\"\n    pass\n\n\nclass KaggleAuthError(PGAdOptimizerError):\n    \"\"\"Raised when Kaggle authentication fails or credentials are missing.\"\"\"\n    pass\n\n\nclass DatasetAccessError(PGAdOptimizerError):\n    \"\"\"Raised when Kaggle dataset download fails or rules are not accepted.\"\"\"\n    pass\n\n\nclass MissingColumnError(PGAdOptimizerError):\n    \"\"\"Raised when an expected column is missing from input or intermediate data.\"\"\"\n    pass\n\n\nclass EmptyDataError(PGAdOptimizerError):\n    \"\"\"Raised when a dataset or filtered view contains zero records.\"\"\"\n    pass\n\n\nclass ConfigError(PGAdOptimizerError):\n    \"\"\"Raised when a YAML or environment configuration is invalid or missing.\"\"\"\n    pass\n\n\nclass BrandMappingError(PGAdOptimizerError):\n    \"\"\"Raised when P&G brand regex mapping fails or generates anomalies.\"\"\"\n    pass\n\n\nclass BudgetCalculationError(PGAdOptimizerError):\n    \"\"\"Raised when budget optimization or ROI constraints fail mathematical limits.\"\"\"\n    pass\n\n\nclass DashboardDataError(PGAdOptimizerError):\n    \"\"\"Raised when data required by Streamlit dashboard is missing or corrupt.\"\"\"\n    pass\n",
  "src/utils/io.py": "\"\"\"\nI/O utility functions for atomic SQLite, Parquet, and CSV storage.\n\"\"\"\n\nimport os\nfrom pathlib import Path\nfrom typing import Dict, Optional, Union\nimport pandas as pd\n\ntry:\n    import sqlite3\n    _HAS_SQLITE = True\nexcept ImportError:\n    sqlite3 = None\n    _HAS_SQLITE = False\n\nfrom src.logging import get_logger\nfrom src.exceptions import EmptyDataError\n\nlogger = get_logger(\"io_utils\")\n\n\ndef ensure_dir(path: Union[str, Path]) -> Path:\n    \"\"\"Ensures that the directory of the specified path exists.\"\"\"\n    p = Path(path)\n    if p.suffix:  # It's a file path\n        p.parent.mkdir(parents=True, exist_ok=True)\n        return p.parent\n    else:\n        p.mkdir(parents=True, exist_ok=True)\n        return p\n\n\ndef save_parquet(df: pd.DataFrame, filepath: Union[str, Path]) -> Path:\n    \"\"\"Saves a DataFrame to Parquet format atomically.\"\"\"\n    target_path = Path(filepath)\n    ensure_dir(target_path)\n    if df.empty:\n        logger.warning(f\"Saving empty DataFrame to {target_path}\")\n    df.to_parquet(target_path, index=False, engine=\"pyarrow\", compression=\"snappy\")\n    logger.debug(f\"Saved {len(df)} rows to Parquet: {target_path}\")\n    return target_path\n\n\ndef read_parquet(filepath: Union[str, Path]) -> pd.DataFrame:\n    \"\"\"Reads a DataFrame from Parquet file with engine fallbacks.\"\"\"\n    path = Path(filepath)\n    if not path.exists():\n        raise FileNotFoundError(f\"Parquet file not found: {path}\")\n    try:\n        df = pd.read_parquet(path)\n    except Exception:\n        try:\n            df = pd.read_parquet(path, engine=\"pyarrow\")\n        except Exception:\n            df = pd.read_parquet(path, engine=\"fastparquet\")\n    logger.debug(f\"Loaded {len(df)} rows from Parquet: {path}\")\n    return df\n\n\ndef save_sqlite(df: pd.DataFrame, db_path: Union[str, Path], table_name: str, if_exists: str = \"replace\") -> None:\n    \"\"\"Saves a DataFrame into a SQLite database table.\"\"\"\n    if not _HAS_SQLITE or sqlite3 is None:\n        logger.debug(\"sqlite3 is not available in this environment. Skipping SQLite save.\")\n        return\n    db_p = Path(db_path)\n    ensure_dir(db_p)\n    with sqlite3.connect(db_p) as conn:\n        df.to_sql(table_name, conn, if_exists=if_exists, index=False)\n    logger.debug(f\"Saved {len(df)} rows to SQLite table '{table_name}' in {db_p}\")\n\n\ndef query_sqlite(query: str, db_path: Union[str, Path]) -> pd.DataFrame:\n    \"\"\"Executes a SQL query against SQLite database and returns a DataFrame.\"\"\"\n    if not _HAS_SQLITE or sqlite3 is None:\n        logger.warning(\"sqlite3 is not available in this environment.\")\n        return pd.DataFrame()\n    db_p = Path(db_path)\n    if not db_p.exists():\n        raise FileNotFoundError(f\"SQLite database not found: {db_p}\")\n    with sqlite3.connect(db_p) as conn:\n        return pd.read_sql_query(query, conn)\n\n\ndef save_csv(df: pd.DataFrame, filepath: Union[str, Path]) -> Path:\n    \"\"\"Saves a DataFrame to CSV format.\"\"\"\n    target_path = Path(filepath)\n    ensure_dir(target_path)\n    df.to_csv(target_path, index=False)\n    logger.info(f\"Exported {len(df)} rows to CSV: {target_path}\")\n    return target_path\n",
  "config/settings.yaml": "# Global Business & Pipeline Settings for P&G Ad Budget Optimizer\n\nproject_name: \"pg_ad_optimizer\"\nrandom_seed: 42\n\n# Financial & Ad Budget Defaults\nbase_ad_budget: 100000.0          # Base budget per segment/period (e.g. INR / USD)\ncurrency: \"USD\"                   # Currency code\ntarget_roi: 1.20                  # Profit ROI hurdle rate (incremental profit / ad spend)\ntarget_roas: 4.00                 # Target return on ad spend\naverage_margin_percentage: 0.35   # 35% Gross margin assumption\naverage_selling_price: 12.50      # Average P&G basket item price\nsupply_target_days: 21            # Inventory safety cover target\n\n# Need Zone & Confidence Settings\nneed_zone_items_limit: 10         # First 10 items added = Last 10 scanned at checkout\nminimum_orders_for_confidence: 30 # Minimum sample size per segment for statistical confidence\nconfidence_level: 0.95            # Wilson score 95% confidence interval\n\n# Multiplier Thresholds\nmultipliers:\n  demand:\n    tier_1: { max_share: 0.10, multiplier: 1.5 } # Awareness push\n    tier_2: { max_share: 0.30, multiplier: 1.3 } # Growth opportunity\n    tier_3: { max_share: 0.50, multiplier: 1.0 } # Baseline demand\n    tier_4: { max_share: 0.80, multiplier: 1.3 } # Strong demand expansion\n    tier_5: { max_share: 1.00, multiplier: 0.8 } # High saturation / maintain\n  supply:\n    critical_stockout: { max_score: 0.60, multiplier: 0.0 }  # Stop advertising immediately\n    low_stock:         { max_score: 0.80, multiplier: 0.5 }  # Partial budget\n    adequate_stock:    { max_score: 1.00, multiplier: 1.0 }  # Full budget\n    surplus_stock:     { min_score: 1.00, multiplier: 1.1 }  # Aggressive push\n\n# Paths Configuration\npaths:\n  raw_cache_dir: \"data/cache\"\n  processed_dir: \"data/processed\"\n  output_dir: \"data/output\"\n  sqlite_db: \"data/processed/pg_ad_optimizer.db\"\n",
  "config/financials.yaml": "# Procter & Gamble Official Financial Benchmark & Marketing Intensity\n# Source: P&G Form 10-K Annual Report (Fiscal Year ended June 30, 2024) - SEC EDGAR\n\ncompany: \"The Procter & Gamble Company\"\nticker: \"PG\"\nfiscal_year: \"FY2024\"\ncurrency: \"USD\"\n\n# Corporate Level Financials\ntotal_revenue: 84039000000.0         # Net Sales: $84.039 Billion\nadvertising_expense: 8560000000.0    # Advertising spend from Note disclosures: $8.560 Billion\nmarketing_intensity: 0.101857        # ~10.19% of Net Sales invested in marketing / advertising\n\n# P&G Reportable Segment Revenue Breakdown\n# Used to allocate corporate marketing budget across product categories\ncategory_revenue_shares:\n  fabric_and_home_care: 0.35         # Tide, Ariel, Dawn, Cascade, Febreze, Swiffer, Downy\n  baby_feminine_and_family: 0.25     # Pampers, Always, Whisper, Tampax, Bounty, Charmin\n  beauty: 0.18                       # Pantene, Head & Shoulders, Herbal Essences, Olay\n  health_care: 0.14                  # Oral-B, Crest, Vicks\n  grooming: 0.08                     # Gillette, Venus, Braun\n\nnotes: >\n  Financial figures are calibrated directly from P&G's FY2024 10-K filed with the US SEC.\n  Exact retail/campaign-level ad spend is allocated proportionally using brand need share\n  and segment revenue weightings.\n",
  "config/pg_brands.yaml": "# P&G Brand Identification Configuration\n# Regex patterns are matched case-insensitively against product_name\n\ninclude_keywords:\n  - tide\n  - ariel\n  - pampers\n  - whisper\n  - pantene\n  - head & shoulders\n  - head shoulders\n  - gillette\n  - venus\n  - oral-b\n  - oral b\n  - crest\n  - dawn\n  - febreze\n  - downy\n  - safeguard\n  - old spice\n  - ambipur\n  - ambi pur\n  - braun\n  - duracell\n  - olay\n  - always\n  - bounty\n  - charmin\n  - cascade\n  - swiffer\n  - gain\n  - vicks\n  - tampax\n  - herbal essences\n  - secret\n  - fixodent\n  - ivory\n\nexclude_keywords:\n  - tide pool\n  - mountain crest\n  - dawn to dusk\n  - golden crest\n  - golden tide\n  - spring tide\n  - high tide\n  - red tide\n  - crest mouthwash alternative generic\n",
  "config/need_want_mapping.yaml": "# Need vs Want Department & Aisle Mapping\n# Essential categories (Staples / Hygiene / Household / Baby) vs Impulse / Indulgence\n\nneed_departments:\n  - personal care\n  - household\n  - babies\n  - pantry\n  - dairy eggs\n  - produce\n  - meat seafood\n\nwant_departments:\n  - snacks\n  - beverages\n  - frozen\n  - bakery\n  - alcohol\n  - international\n  - deli\n  - missing\n  - other\n\n# Granular aisle overrides where necessary\nneed_aisles:\n  - laundry\n  - diapers wipes\n  - oral hygiene\n  - soap\n  - body lotions soap\n  - hair care\n  - shave needs\n  - dish detergents\n  - paper goods\n  - cleaning products\n  - baby food formula\n  - feminine care\n  - deodorant\n\nwant_aisles:\n  - candy chocolate\n  - cookies cakes\n  - chips pretzels\n  - soft drinks\n  - energy granola bars\n  - ice cream ice\n  - beer cooler\n  - specialty wines champagnes\n",
  "config/supply.yaml": "# Supply & Inventory Proxy Configuration\n# Instacart does not provide live retailer warehouse inventory.\n# This configuration governs proxy availability scoring based on reorder regularity,\n# basket appearance frequency, and simulated stock cover metrics.\n\ndefault_supply_score: 0.95\nfixed_seed: 42\n\n# Manual Department / Category Stock Score Overrides (for simulation or specific stress testing)\ndepartment_supply_overrides:\n  personal care: 0.92\n  household: 0.88\n  babies: 0.95\n  pantry: 0.85\n  snacks: 0.98\n  beverages: 0.90\n  dairy eggs: 0.82\n  produce: 0.78\n  meat seafood: 0.75\n  alcohol: 0.85\n\n# Specific brand / category risk flags\ncritical_low_stock_categories: []\n\n# Supply Multiplier Tiers\ntiers:\n  - { threshold: 0.60, multiplier: 0.0, label: \"CRITICAL_STOCKOUT\", description: \"Halt all ads to prevent customer churn and wasted media spend.\" }\n  - { threshold: 0.80, multiplier: 0.5, label: \"LOW_STOCK\",         description: \"Throttle ad spend by 50% while replenishment is underway.\" }\n  - { threshold: 1.00, multiplier: 1.0, label: \"ADEQUATE_STOCK\",    description: \"Full budget deployed at normal pace.\" }\n  - { threshold: 9.99, multiplier: 1.1, label: \"SURPLUS_STOCK\",     description: \"Boost budget by 10% to accelerate clearance and volume.\" }\n",
